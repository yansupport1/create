name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode build"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
      app_name:
        description: "Nama aplikasi (dipertahankan dari proyek Flutter bila kosong)"
        required: false
        default: ""
        type: string
      webview_url:
        description: "URL WebView opsional"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout proyek Flutter user
        uses: actions/checkout@v4

      - name: Validasi proyek Flutter
        shell: bash
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml tidak ditemukan di root proyek ZIP user"; exit 1; }
          test -d android || { echo "folder android tidak ditemukan; ZIP harus berisi proyek Flutter lengkap"; exit 1; }
          test -f lib/main.dart || { echo "lib/main.dart tidak ditemukan"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK dari proyek user
        shell: bash
        env:
          BUILD_MODE: ${{ github.event.inputs.mode || 'debug' }}
          APP_NAME: ${{ github.event.inputs.app_name || '' }}
          WEBVIEW_URL: ${{ github.event.inputs.webview_url || '' }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            flutter build apk --release --dart-define=APP_NAME="$APP_NAME" --dart-define=WEBVIEW_URL="$WEBVIEW_URL"
          else
            flutter build apk --debug --dart-define=APP_NAME="$APP_NAME" --dart-define=WEBVIEW_URL="$WEBVIEW_URL"
          fi

      - name: Siapkan APK langsung
        shell: bash
        env:
          BUILD_MODE: ${{ github.event.inputs.mode || 'debug' }}
        run: |
          mkdir -p build/apk-artifact
          APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "APK tidak ditemukan setelah build"; exit 1; }
          APP_SLUG=$(awk -F: '/^name:[[:space:]]*/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' pubspec.yaml | tr '_' '-' | tr -cd '[:alnum:].-')
          [ -n "$APP_SLUG" ] || APP_SLUG="flutter-app"
          cp "$APK" "build/apk-artifact/${APP_SLUG}-${BUILD_MODE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.mode || 'debug' }}
          path: build/apk-artifact/*.apk
          if-no-files-found: error
