name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode build"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
      app_name:
        description: "Nama aplikasi WebView"
        required: false
        default: WebView App
        type: string
      webview_url:
        description: "URL yang dibuka oleh WebView"
        required: false
        default: https://example.com
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

defaults:
  run:
    working-directory: github-deploy

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_MODE: ${{ inputs.mode || 'debug' }}
      APP_NAME: ${{ inputs.app_name || 'WebView App' }}
      WEBVIEW_URL: ${{ inputs.webview_url || 'https://example.com' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f pubspec.yaml ]; then
            echo 'pubspec.yaml tidak ditemukan di github-deploy.' >&2
            exit 1
          fi

          if [ ! -d android ]; then
            flutter create \
              --no-pub \
              --platforms=android \
              --project-name webview_app \
              --org com.webviewapp \
              .
          fi

          manifest='android/app/src/main/AndroidManifest.xml'
          if [ -f "$manifest" ] && ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest[[:space:]]/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

          flutter pub get

      - name: Validate Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --${BUILD_MODE} \
            --dart-define="WEBVIEW_URL=${WEBVIEW_URL}" \
            --dart-define="APP_NAME=${APP_NAME}"

      - name: Show APK outputs
        if: always()
        run: find build -type f -name '*.apk' -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.mode || 'debug' }}-${{ github.run_number }}
          path: github-deploy/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

          if [ ! -d android ]; then
            flutter create \
              --no-pub \
              --platforms=android \
              --project-name webview_app \
              --org com.webviewapp \
              .
          fi

          manifest='android/app/src/main/AndroidManifest.xml'
          if [ -f "$manifest" ] && ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest[[:space:]]/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

          flutter pub get

      - name: Validate Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --${BUILD_MODE} \
            --dart-define="WEBVIEW_URL=${WEBVIEW_URL}" \
            --dart-define="APP_NAME=${APP_NAME}"

      - name: Show APK outputs
        if: always()
        run: find build -type f -name '*.apk' -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.mode || 'debug' }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

          if [ ! -d android ]; then
            flutter create \
              --no-pub \
              --platforms=android \
              --project-name webview_app \
              --org com.webviewapp \
              .
          fi

          manifest='android/app/src/main/AndroidManifest.xml'
          if [ -f "$manifest" ] && ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest[[:space:]]/a\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

          flutter pub get

      - name: Validate Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --${BUILD_MODE} \
            --dart-define="WEBVIEW_URL=${WEBVIEW_URL}" \
            --dart-define="APP_NAME=${APP_NAME}"

      - name: Show APK outputs
        if: always()
        run: find build -type f -name '*.apk' -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.mode || 'debug' }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
