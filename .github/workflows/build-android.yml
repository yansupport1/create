name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "debug atau release"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release
      app_name:
        description: "Nama aplikasi (WebView build)"
        required: false
        default: ""
      webview_url:
        description: "URL WebView"
        required: false
        default: ""
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Inject WebView config (optional)
        if: ${{ github.event.inputs.webview_url != '' }}
        run: |
          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          echo "WEBVIEW_URL=${{ github.event.inputs.webview_url }}" >> $GITHUB_ENV
          # Sesuaikan path project Flutter kamu bila perlu:
          # sed -i "s|https://example.com|${{ github.event.inputs.webview_url }}|g" lib/main.dart || true

      - name: Build debug
        if: ${{ (github.event.inputs.mode || 'debug') != 'release' }}
        run: flutter build apk --debug --dart-define=WEBVIEW_URL=${{ github.event.inputs.webview_url || '' }} --dart-define=APP_NAME=${{ github.event.inputs.app_name || '' }}

      - name: Build release
        if: ${{ (github.event.inputs.mode || 'debug') == 'release' }}
        run: flutter build apk --release --dart-define=WEBVIEW_URL=${{ github.event.inputs.webview_url || '' }} --dart-define=APP_NAME=${{ github.event.inputs.app_name || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.mode || 'debug' }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
